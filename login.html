<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CyberDefend Academy · Login</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        /* ========== THEME VARIABLES (DARK MODE DEFAULT) ========== */
        :root {
            --primary: #00e676; /* الأخضر من الصورة */
            --primary-fg: #000000;
            --body-fg: #ffffff;
            --body-bg: #121212;
            --body-quiet-color: #b0b0b0;
            --body-loud-color: #ffffff;
            --hairline-color: #272727;
            --border-color: #353535;
            --darkened-bg: #1e1e1e; /* خلفية الكروت */
            --selected-bg: #2a2a2a;
            --header-bg: #1a1a1a; /* خلفية الشريط العلوي */
            --input-bg: #242424;
        }

        /* ========== LIGHT MODE ========== */
        html[data-theme="light"] {
            --primary: #02b3e4;
            --primary-fg: #ffffff;
            --body-fg: #1a2c3e;
            --body-bg: #f5f7fc;
            --body-quiet-color: #5c6f87;
            --body-loud-color: #0b2b3b;
            --hairline-color: #e6edf4;
            --border-color: #eef2f8;
            --darkened-bg: #ffffff;
            --selected-bg: #e9f4fa;
            --header-bg: #ffffff;
            --input-bg: #f9fbfe;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; background: var(--body-bg); color: var(--body-fg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; transition: background 0.3s, color 0.3s; }

        /* ========== TOP NAVIGATION BAR ========== */
        .top-nav { display: flex; align-items: center; justify-content: space-between; padding: 18px 40px; background: var(--header-bg); border-bottom: 1px solid var(--hairline-color); position: sticky; top: 0; z-index: 100; }
        .nav-brand { display: flex; align-items: center; gap: 12px; }
        .nav-logo-icon { background: var(--primary); color: var(--primary-fg); width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; box-shadow: 0 4px 10px rgba(0,230,118,0.2); }
        .nav-brand-text h1 { font-size: 1.1rem; font-weight: 800; color: var(--body-loud-color); line-height: 1.2; }
        .nav-brand-text span { font-size: 0.6rem; color: var(--body-quiet-color); font-weight: 600; }
        
        .top-nav-links { display: flex; gap: 25px; align-items: center; }
        .top-nav-links a { color: var(--body-quiet-color); text-decoration: none; font-size: 0.9rem; font-weight: 600; transition: 0.2s; padding: 5px 0; border-bottom: 2px solid transparent; }
        .top-nav-links a:hover { color: var(--body-fg); }
        .top-nav-links a.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .top-nav-links a.login-btn { background: var(--primary); color: var(--primary-fg); padding: 8px 18px; border-radius: 8px; }
        .top-nav-links a.login-btn:hover { opacity: 0.9; }

        /* ========== LOGIN FORM ========== */
        .login-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: var(--darkened-bg); border: 1px solid var(--hairline-color); border-radius: 20px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .login-header { text-align: center; margin-bottom: 30px; }
        .login-header h2 { font-size: 1.8rem; font-weight: 700; color: var(--body-loud-color); margin-bottom: 8px; }
        .login-header p { color: var(--body-quiet-color); font-size: 0.9rem; }
        
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--body-quiet-color); margin-bottom: 8px; }
        .input-group input { width: 100%; padding: 14px 16px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 10px; color: var(--body-fg); font-family: inherit; font-size: 0.95rem; outline: none; transition: 0.2s; }
        .input-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,230,118,0.1); }
        .input-group input::placeholder { color: #666; }

        .btn-signin { width: 100%; padding: 14px; background: var(--primary); color: var(--primary-fg); border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn-signin:hover { opacity: 0.9; transform: translateY(-1px); }

        .login-links { display: flex; justify-content: space-between; margin-top: 25px; font-size: 0.85rem; }
        .login-links a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .login-links a:hover { text-decoration: underline; }

        @media (max-width: 780px) {
            .top-nav { padding: 15px 20px; flex-direction: column; gap: 15px; }
            .top-nav-links { gap: 15px; flex-wrap: wrap; justify-content: center; }
            .top-nav-links a { font-size: 0.8rem; }
            .login-card { padding: 30px; }
        }
    </style>
</head>
<body>
<!-- CHECK SAVED THEME IMMEDIATELY -->
<script>
    const savedTheme = localStorage.getItem('cd_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
</script>

<!-- TOP NAVIGATION TABS -->
<nav class="top-nav">
    <div class="nav-brand">
        <div class="nav-logo-icon">🛡️</div>
        <div class="nav-brand-text">
            <h1>CyberDefend</h1>
            <span>Modern cybersecurity learning platform</span>
        </div>
    </div>
    <div class="top-nav-links">
        <a href="index.html">Dashboard</a>
        <a href="courses.html">Courses</a>
        <a href="library.html">Library</a>
        <a href="messages.html">Messages</a>
        <a href="profile.html">Profile</a>
        <a href="settings.html">Settings</a>
        <a href="admin.html">Admin</a>
        <a href="login.html" class="login-btn">Login</a>
    </div>
</nav>

<!-- LOGIN FORM -->
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h2>Welcome back</h2>
            <p>Sign in to access your courses and progress.</p>
        </div>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-signin">Sign in</button>
        </form>
        <div class="login-links">
            <a href="#">Forgot password?</a>
            <a href="#">Create account</a>
        </div>
    </div>
</div>

<script>
    function handleLogin(event) {
        event.preventDefault(); // منع إعادة تحديث الصفحة
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        // يمكنك إضافة منطق التحقق هنا (مثل استدعاء Google Script أو API)
        console.log("Logging in with:", email);

        // محاكاة تسجيل الدخول الناجح والعودة للصفحة الرئيسية
        alert("Login successful! Redirecting to dashboard...");
        window.location.href = "index.html";
    }
</script>
</body>
</html>
