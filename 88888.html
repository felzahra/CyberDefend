<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberDefend · Attack Simulation Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg: #0a0e14;
            --bg-raised: #0f1419;
            --bg-card: #131920;
            --bg-terminal: #080c10;
            --fg: #c5cdd8;
            --fg-bright: #e8edf3;
            --fg-dim: #4d5969;
            --accent: #00ff9c;
            --accent-dim: rgba(0,255,156,0.12);
            --accent-mid: rgba(0,255,156,0.3);
            --red: #ff3b5c;
            --red-dim: rgba(255,59,92,0.12);
            --orange: #ff9f43;
            --orange-dim: rgba(255,159,67,0.12);
            --cyan: #00d4ff;
            --cyan-dim: rgba(0,212,255,0.12);
            --yellow: #ffd93d;
            --yellow-dim: rgba(255,217,61,0.12);
            --purple: #a855f7;
            --border: #1e2733;
            --border-light: #2a3544;
            --radius: 10px;
            --mono: 'JetBrains Mono', 'Courier New', monospace;
            --sans: 'Inter', system-ui, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* === BACKGROUND EFFECTS === */
        .bg-grid {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image:
                linear-gradient(rgba(0,255,156,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,156,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
        }
        .bg-glow {
            position: fixed; z-index: 0; pointer-events: none;
            width: 600px; height: 600px; border-radius: 50%;
            filter: blur(150px); opacity: 0.07;
        }
        .bg-glow-1 { top: -200px; right: -100px; background: var(--accent); }
        .bg-glow-2 { bottom: -200px; left: -100px; background: var(--cyan); }

        /* === LAYOUT === */
        .app-container { position: relative; z-index: 1; }

        /* === TOP BAR === */
        .top-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 32px;
            background: rgba(10,14,20,0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
        }
        .top-bar-left { display: flex; align-items: center; gap: 14px; }
        .top-bar-logo {
            width: 36px; height: 36px; border-radius: 8px;
            background: linear-gradient(135deg, var(--accent), var(--cyan));
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem; color: #000; font-weight: 800;
        }
        .top-bar-title { font-size: 1rem; font-weight: 700; color: var(--fg-bright); }
        .top-bar-sub { font-size: 0.65rem; color: var(--fg-dim); font-weight: 500; letter-spacing: 1px; text-transform: uppercase; }
        .top-bar-right { display: flex; align-items: center; gap: 12px; }
        .status-badge {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 600;
            border: 1px solid var(--border-light);
        }
        .status-badge.idle { background: var(--bg-card); color: var(--fg-dim); }
        .status-badge.running { background: var(--accent-dim); color: var(--accent); border-color: var(--accent-mid); }
        .status-badge.complete { background: var(--cyan-dim); color: var(--cyan); border-color: rgba(0,212,255,0.3); }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; }
        .status-badge.idle .status-dot { background: var(--fg-dim); }
        .status-badge.running .status-dot { background: var(--accent); animation: pulse-dot 1.5s infinite; }
        .status-badge.complete .status-dot { background: var(--cyan); }
        @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        .btn-reset {
            padding: 7px 16px; border-radius: 8px; font-size: 0.78rem; font-weight: 600;
            background: var(--bg-card); color: var(--fg); border: 1px solid var(--border-light);
            cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px;
            font-family: var(--sans);
        }
        .btn-reset:hover { border-color: var(--red); color: var(--red); background: var(--red-dim); }

        /* === MAIN CONTENT === */
        .main-layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 0;
            min-height: calc(100vh - 69px);
        }

        /* === SIDEBAR === */
        .sidebar {
            background: var(--bg-raised);
            border-right: 1px solid var(--border);
            padding: 24px 0;
            overflow-y: auto;
            max-height: calc(100vh - 69px);
            position: sticky; top: 69px;
        }
        .sidebar::-webkit-scrollbar { width: 3px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 10px; }

        .sidebar-label {
            font-size: 0.65rem; font-weight: 700; color: var(--fg-dim);
            text-transform: uppercase; letter-spacing: 1.5px;
            padding: 0 20px; margin-bottom: 14px;
        }

        .phase-item {
            display: flex; align-items: flex-start; gap: 12px;
            padding: 12px 20px; cursor: pointer;
            transition: 0.2s; border-left: 3px solid transparent;
            position: relative;
        }
        .phase-item:hover { background: rgba(255,255,255,0.02); }
        .phase-item.active { background: var(--accent-dim); border-left-color: var(--accent); }
        .phase-item.done { opacity: 0.6; }
        .phase-item.done .phase-num { background: var(--accent); color: #000; }

        .phase-num {
            width: 28px; height: 28px; border-radius: 7px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.72rem; font-weight: 700;
            background: var(--bg-card); color: var(--fg-dim);
            border: 1px solid var(--border-light);
            font-family: var(--mono);
            transition: 0.3s;
        }
        .phase-item.active .phase-num { background: var(--accent); color: #000; border-color: var(--accent); }

        .phase-info { flex: 1; min-width: 0; }
        .phase-name { font-size: 0.82rem; font-weight: 600; color: var(--fg-bright); line-height: 1.3; }
        .phase-item.active .phase-name { color: var(--accent); }
        .phase-desc { font-size: 0.68rem; color: var(--fg-dim); margin-top: 2px; line-height: 1.3; }

        .sidebar-progress {
            margin: 24px 20px 0; padding: 16px;
            background: var(--bg-card); border-radius: var(--radius);
            border: 1px solid var(--border);
        }
        .progress-label { font-size: 0.68rem; font-weight: 600; color: var(--fg-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .progress-bar-bg { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--cyan)); border-radius: 3px; transition: width 0.5s ease; width: 0%; }

        /* === CONTENT AREA === */
        .content-area { padding: 28px 32px; overflow-y: auto; }

        /* Phase Header */
        .phase-header { margin-bottom: 28px; }
        .phase-header-num {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 0.72rem; font-weight: 700; color: var(--accent);
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px;
            font-family: var(--mono);
        }
        .phase-header-num::before {
            content: ''; width: 24px; height: 2px; background: var(--accent); border-radius: 1px;
        }
        .phase-header h2 { font-size: 1.8rem; font-weight: 800; color: var(--fg-bright); line-height: 1.2; margin-bottom: 10px; }
        .phase-header p { font-size: 0.9rem; color: var(--fg-dim); line-height: 1.7; max-width: 700px; }

        /* Cards */
        .info-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 20px; margin-bottom: 20px;
            transition: border-color 0.2s;
        }
        .info-card:hover { border-color: var(--border-light); }
        .info-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .info-card-icon {
            width: 34px; height: 34px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; font-size: 0.9rem;
        }
        .info-card-icon.green { background: var(--accent-dim); color: var(--accent); }
        .info-card-icon.red { background: var(--red-dim); color: var(--red); }
        .info-card-icon.orange { background: var(--orange-dim); color: var(--orange); }
        .info-card-icon.cyan { background: var(--cyan-dim); color: var(--cyan); }
        .info-card-icon.yellow { background: var(--yellow-dim); color: var(--yellow); }
        .info-card-icon.purple { background: rgba(168,85,247,0.12); color: var(--purple); }
        .info-card-title { font-size: 0.95rem; font-weight: 700; color: var(--fg-bright); }
        .info-card p, .info-card li { font-size: 0.84rem; color: var(--fg); line-height: 1.7; }
        .info-card ul { list-style: none; padding: 0; }
        .info-card ul li { padding: 4px 0; padding-left: 18px; position: relative; }
        .info-card ul li::before {
            content: '→'; position: absolute; left: 0; color: var(--accent); font-weight: 700;
        }

        /* Terminal */
        .terminal-wrapper { margin-bottom: 24px; }
        .terminal-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 16px;
            background: #0d1117; border: 1px solid var(--border); border-bottom: none;
            border-radius: var(--radius) var(--radius) 0 0;
        }
        .terminal-dots { display: flex; gap: 7px; }
        .terminal-dots span { width: 11px; height: 11px; border-radius: 50%; }
        .terminal-dots span:nth-child(1) { background: #ff5f57; }
        .terminal-dots span:nth-child(2) { background: #febc2e; }
        .terminal-dots span:nth-child(3) { background: #28c840; }
        .terminal-tab {
            font-size: 0.72rem; font-weight: 600; color: var(--fg-dim);
            font-family: var(--mono); padding: 4px 12px;
            background: var(--bg-card); border-radius: 5px;
            border: 1px solid var(--border);
        }
        .terminal-actions { display: flex; gap: 6px; }
        .terminal-btn {
            padding: 4px 10px; border-radius: 5px; font-size: 0.68rem; font-weight: 600;
            border: 1px solid var(--border-light); background: var(--bg-card);
            color: var(--fg-dim); cursor: pointer; font-family: var(--mono);
            transition: 0.2s;
        }
        .terminal-btn:hover { border-color: var(--accent); color: var(--accent); }
        .terminal-btn.run { background: var(--accent-dim); color: var(--accent); border-color: var(--accent-mid); }
        .terminal-btn.run:hover { background: var(--accent); color: #000; }

        .terminal-body {
            background: var(--bg-terminal); border: 1px solid var(--border); border-top: none;
            border-radius: 0 0 var(--radius) var(--radius);
            padding: 16px; min-height: 200px; max-height: 450px; overflow-y: auto;
            font-family: var(--mono); font-size: 0.8rem; line-height: 1.7;
        }
        .terminal-body::-webkit-scrollbar { width: 4px; }
        .terminal-body::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 10px; }

        .t-line { white-space: pre-wrap; word-break: break-all; }
        .t-prompt { color: var(--accent); }
        .t-cmd { color: var(--fg-bright); }
        .t-output { color: var(--fg-dim); }
        .t-highlight { color: var(--cyan); }
        .t-warning { color: var(--orange); }
        .t-error { color: var(--red); }
        .t-success { color: var(--accent); }
        .t-info { color: var(--yellow); }
        .t-separator { color: var(--border-light); }

        .cursor-blink {
            display: inline-block; width: 8px; height: 15px;
            background: var(--accent); vertical-align: middle;
            animation: blink-cursor 1s step-end infinite;
        }
        @keyframes blink-cursor { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

        /* Network Topology */
        .network-viz {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 24px; margin-bottom: 24px;
            position: relative; overflow: hidden;
        }
        .network-viz::before {
            content: ''; position: absolute; inset: 0;
            background-image: radial-gradient(circle, var(--border) 1px, transparent 1px);
            background-size: 30px 30px; opacity: 0.5;
        }
        .network-title { font-size: 0.72rem; font-weight: 700; color: var(--fg-dim); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 20px; position: relative; }
        .network-nodes { display: flex; align-items: center; justify-content: center; gap: 40px; flex-wrap: wrap; position: relative; }
        .net-node {
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            position: relative; z-index: 1;
        }
        .net-node-icon {
            width: 56px; height: 56px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center; font-size: 1.3rem;
            border: 2px solid var(--border-light); transition: 0.5s;
        }
        .net-node-icon.attacker { background: var(--red-dim); color: var(--red); border-color: rgba(255,59,92,0.3); }
        .net-node-icon.target { background: var(--orange-dim); color: var(--orange); border-color: rgba(255,159,67,0.3); }
        .net-node-icon.internal { background: var(--cyan-dim); color: var(--cyan); border-color: rgba(0,212,255,0.3); }
        .net-node-icon.exfil { background: var(--purple); color: #fff; border-color: rgba(168,85,247,0.3); }
        .net-node-icon.safe { background: var(--accent-dim); color: var(--accent); border-color: var(--accent-mid); }

        .net-node-icon.pulsing { animation: node-pulse 2s infinite; }
        @keyframes node-pulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(255,59,92,0.4); }
            50% { box-shadow: 0 0 0 12px rgba(255,59,92,0); }
        }
        .net-node-label { font-size: 0.72rem; font-weight: 600; color: var(--fg-dim); text-align: center; }
        .net-node-ip { font-size: 0.65rem; color: var(--fg-dim); font-family: var(--mono); opacity: 0.6; }

        .net-arrow {
            color: var(--fg-dim); font-size: 1.2rem; opacity: 0.4;
            position: relative; z-index: 1;
        }
        .net-arrow.active { color: var(--red); opacity: 1; animation: arrow-flow 1.5s infinite; }
        @keyframes arrow-flow { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* Alert Log */
        .alert-log {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); margin-bottom: 24px; overflow: hidden;
        }
        .alert-log-header {
            padding: 12px 16px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .alert-log-title { font-size: 0.78rem; font-weight: 700; color: var(--fg-dim); text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
        .alert-log-count {
            font-size: 0.68rem; font-weight: 700; padding: 2px 8px;
            border-radius: 10px; font-family: var(--mono);
        }
        .alert-log-count.critical { background: var(--red-dim); color: var(--red); }
        .alert-log-count.warning { background: var(--orange-dim); color: var(--orange); }
        .alert-log-count.info { background: var(--cyan-dim); color: var(--cyan); }

        .alert-log-body { max-height: 200px; overflow-y: auto; }
        .alert-log-body::-webkit-scrollbar { width: 3px; }
        .alert-log-body::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 10px; }

        .alert-entry {
            display: flex; align-items: flex-start; gap: 10px;
            padding: 10px 16px; border-bottom: 1px solid var(--border);
            font-size: 0.78rem; animation: alert-slide 0.3s ease;
        }
        @keyframes alert-slide { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        .alert-entry:last-child { border-bottom: none; }
        .alert-time { color: var(--fg-dim); font-family: var(--mono); font-size: 0.7rem; white-space: nowrap; padding-top: 1px; }
        .alert-severity {
            font-size: 0.6rem; font-weight: 700; padding: 2px 6px; border-radius: 4px;
            text-transform: uppercase; white-space: nowrap;
        }
        .alert-severity.critical { background: var(--red-dim); color: var(--red); }
        .alert-severity.high { background: var(--orange-dim); color: var(--orange); }
        .alert-severity.medium { background: var(--yellow-dim); color: var(--yellow); }
        .alert-severity.low { background: var(--cyan-dim); color: var(--cyan); }
        .alert-msg { color: var(--fg); line-height: 1.4; }

        /* Next Phase Button */
        .btn-next-phase {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 14px 32px; border-radius: var(--radius);
            font-size: 0.9rem; font-weight: 700; cursor: pointer;
            background: linear-gradient(135deg, var(--accent), #00d4aa);
            color: #000; border: none; font-family: var(--sans);
            transition: 0.3s; box-shadow: 0 4px 20px rgba(0,255,156,0.2);
        }
        .btn-next-phase:hover { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(0,255,156,0.3); }
        .btn-next-phase:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }

        .phase-complete-banner {
            display: none; align-items: center; gap: 12px;
            padding: 16px 20px; border-radius: var(--radius);
            background: var(--accent-dim); border: 1px solid var(--accent-mid);
            margin-bottom: 24px;
        }
        .phase-complete-banner.show { display: flex; }
        .phase-complete-banner i { color: var(--accent); font-size: 1.2rem; }
        .phase-complete-banner span { color: var(--accent); font-weight: 600; font-size: 0.88rem; }

        /* Responsive */
        @media (max-width: 1024px) {
            .main-layout { grid-template-columns: 1fr; }
            .sidebar {
                position: relative; top: 0; max-height: none;
                display: flex; overflow-x: auto; padding: 12px;
                border-right: none; border-bottom: 1px solid var(--border);
                gap: 4px;
            }
            .sidebar-label { display: none; }
            .sidebar-progress { display: none; }
            .phase-item { padding: 10px 14px; white-space: nowrap; border-left: none; border-bottom: 2px solid transparent; flex-shrink: 0; }
            .phase-item.active { border-bottom-color: var(--accent); border-left: none; }
            .phase-desc { display: none; }
        }
        @media (max-width: 600px) {
            .top-bar { padding: 12px 16px; }
            .content-area { padding: 20px 16px; }
            .phase-header h2 { font-size: 1.4rem; }
            .network-nodes { gap: 20px; }
            .net-node-icon { width: 44px; height: 44px; font-size: 1rem; }
        }
    </style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>

<div class="app-container">

    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="top-bar-left">
            <div class="top-bar-logo"><i class="fas fa-crosshairs"></i></div>
            <div>
                <div class="top-bar-title">Attack Simulation Lab</div>
                <div class="top-bar-sub">CyberDefend Academy</div>
            </div>
        </div>
        <div class="top-bar-right">
            <div class="status-badge idle" id="statusBadge">
                <span class="status-dot"></span>
                <span id="statusText">Ready</span>
            </div>
            <button class="btn-reset" id="btnReset" onclick="resetLab()">
                <i class="fas fa-rotate-left"></i> Reset
            </button>
        </div>
    </div>

    <!-- MAIN LAYOUT -->
    <div class="main-layout">

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
<!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-back-btns">
                    <a href="index.html" class="sidebar-back-btn">&larr; Back to Dashboard</a>
                </div>
            </div>

            <div class="sidebar-label">Attack Phases</div>
            <div id="sidebarPhases"></div>
            
            <div class="sidebar-progress">
                <div class="progress-label">
                    <span>Lab Progress</span>
                    <span id="progressPct">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>
            </div>
        </aside>
        </aside>

        <!-- CONTENT -->
        <main class="content-area" id="contentArea"></main>

    </div>
</div>

<script>
// ============================================================
// ATTACK SIMULATION LAB — Complete Phase Data & Engine
// ============================================================

const PHASES = [
    {
        id: 1,
        name: "Reconnaissance",
        desc: "Passive & active information gathering",
        icon: "fa-magnifying-glass",
        color: "cyan",
        overview: "The attacker begins by collecting as much information as possible about the target without directly engaging their systems. This includes DNS records, subdomains, IP ranges, publicly exposed services, and any leaked credentials or sensitive data found on search engines or public repositories.",
        objectives: [
            "Identify the target's external IP address range and ASN information",
            "Enumerate all subdomains and map the attack surface",
            "Discover open ports and running services via active scanning",
            "Gather OSINT data from public sources (search engines, social media, pastebins)"
        ],
        tools: ["Nmap", "Amass", "theHarvester", "DNSRecon", "Shodan", "Whois"],
        network: { attacker: true, arrow1: false, target: false, arrow2: false, internal: false, arrow3: false, exfil: false },
        terminal: [
            { type: "cmd", text: "whois targetcorp.com" },
            { type: "output", text: "Domain Name: TARGETCORP.COM\nRegistrar: GoDaddy.com, LLC\nCreation Date: 2019-03-15T08:22:31Z\nExpiry Date: 2026-03-15T08:22:31Z\nName Server: ns1.targetcorp.com\nName Server: ns2.targetcorp.com\nDNSSEC: unsigned" },

// ============================================================
// STATE
// ============================================================
let currentPhase = 0;
let isRunning = false;
let terminalQueue = [];
let alertQueue = [];
let typingInterval = null;

// ============================================================
// INIT
// ============================================================
function initLab() {
    renderSidebar();
    renderPhase(0);
}

// ============================================================
// SIDEBAR
// ============================================================
function renderSidebar() {
    const sb = document.getElementById('sidebar');
    let html = '<div class="sidebar-label">Attack Phases</div>';
    PHASES.forEach((p, i) => {
        let cls = '';
        if (i === currentPhase) cls = 'active';
        else if (i < currentPhase) cls = 'done';
        html += `
            <div class="phase-item ${cls}" onclick="goToPhase(${i})" id="phase-item-${i}">
                <div class="phase-num">${i < currentPhase ? '<i class="fas fa-check" style="font-size:0.65rem"></i>' : (i + 1)}</div>
                <div class="phase-info">
                    <div class="phase-name">${p.name}</div>
                    <div class="phase-desc">${p.desc}</div>
                </div>
            </div>
        `;
    });
    const pct = Math.round((currentPhase / PHASES.length) * 100);
    html += `
        <div class="sidebar-progress">
            <div class="progress-label"><span>Progress</span><span id="progressPct">${pct}%</span></div>
            <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill" style="width:${pct}%"></div></div>
        </div>
    `;
    sb.innerHTML = html;
}

}

// ============================================================
// TERMINAL ENGINE
// ============================================================
function runPhaseTerminal() {
    if (isRunning) return;
    isRunning = true;

    const p = PHASES[currentPhase];
    terminalQueue = [...p.terminal];
    alertQueue = [...p.alerts];

    // Update status
    const badge = document.getElementById('statusBadge');
    badge.className = 'status-badge running';
    document.getElementById('statusText').textContent = 'Phase ' + p.id + ' Running';

    // Disable run button
    document.getElementById('btnRun').disabled = true;
    document.getElementById('btnRun').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Running';

    // Clear terminal
    const tb = document.getElementById('terminalBody');
    tb.innerHTML = `<div class="t-line t-output"># Phase ${p.id}: ${p.name} — Simulation started</div>`;
    document.getElementById('alertLogBody').innerHTML = '';

    processTerminalQueue();
}

function processTerminalQueue() {
    if (terminalQueue.length === 0) {
        finishPhase();
        return;
    }

    const item = terminalQueue.shift();
    const tb = document.getElementById('terminalBody');

    // Remove cursor
    const cursor = document.getElementById('cursor');
    if (cursor) cursor.remove();

    if (item.type === 'separator') {
        const sep = document.createElement('div');
        sep.className = 't-line t-separator';
        sep.textContent = '─'.repeat(60);
        tb.appendChild(sep);
        tb.scrollTop = tb.scrollHeight;
        setTimeout(processTerminalQueue, 150);
        return;
    }

    if (item.type === 'success') {
        const line = document.createElement('div');
        line.className = 't-line t-success';
        line.textContent = item.text;
        tb.appendChild(line);
        tb.scrollTop = tb.scrollHeight;
        setTimeout(processTerminalQueue, 400);
        return;
    }

    if (item.type === 'cmd') {
        const line = document.createElement('div');
        line.className = 't-line';
        line.innerHTML = `<span class="t-prompt">attacker@kali</span><span class="t-output">:</span><span class="t-highlight">~</span><span class="t-output">$ </span><span class="t-cmd" id="typing-target"></span><span class="cursor-blink"></span>`;
        tb.appendChild(line);
        tb.scrollTop = tb.scrollHeight;

        const target = document.getElementById('typing-target');
        typeText(target, item.text, () => {
            setTimeout(processTerminalQueue, 300);
        });
    } else {
        // Output — type it out line by line
        const lines = item.text.split('\n');
        let lineIdx = 0;
        function nextLine() {
            if (lineIdx >= lines.length) {
                setTimeout(processTerminalQueue, 200);
                return;
            }
            const line = document.createElement('div');
            line.className = 't-line t-output';
            line.textContent = lines[lineIdx];
            tb.appendChild(line);
            tb.scrollTop = tb.scrollHeight;
            lineIdx++;
            setTimeout(nextLine, 30 + Math.random() * 20);
        }
        nextLine();
    }
}

function typeText(el, text, cb) {
    let i = 0;
    clearInterval(typingInterval);
    typingInterval = setInterval(() => {
        if (i >= text.length) {
            clearInterval(typingInterval);
            // Remove cursor after typing
            const cursors = el.parentElement.querySelectorAll('.cursor-blink');
            cursors.forEach(c => {
                const newC = document.createElement('span');
                newC.className = 'cursor-blink';
                el.parentElement.appendChild(newC);
                c.remove();
            });
            if (cb) cb();
            return;
        }
        el.textContent += text[i];
        i++;
        // Scroll terminal
        const tb = document.getElementById('terminalBody');
        tb.scrollTop = tb.scrollHeight;
    }, 25 + Math.random() * 25);
}

function clearTerminal() {
    const tb = document.getElementById('terminalBody');
    tb.innerHTML = '<div class="t-line t-output"># Terminal cleared</div><div class="t-line"><span class="cursor-blink"></span></div>';
}

// ============================================================
// ALERT ENGINE
// ============================================================
function processAlertQueue() {
    if (alertQueue.length === 0) return;
    const alert = alertQueue.shift();
    const body = document.getElementById('alertLogBody');
    const now = new Date();
    const time = now.toTimeString().slice(0, 8);

    const entry = document.createElement('div');
    entry.className = 'alert-entry';
    entry.innerHTML = `
        <span class="alert-time">${time}</span>
        <span class="alert-severity ${alert.severity}">${alert.severity}</span>
        <span class="alert-msg">${alert.msg}</span>
    `;
    body.appendChild(entry);
    body.scrollTop = body.scrollHeight;

    // Update count
    const count = body.querySelectorAll('.alert-entry').length;
    const countEl = document.getElementById('alertCount');
    countEl.textContent = count + ' alert' + (count !== 1 ? 's' : '');

    if (alertQueue.length > 0) {
        setTimeout(processAlertQueue, 1500 + Math.random() * 1500);
    }
}

// ============================================================
// PHASE COMPLETION
// ============================================================
function finishPhase() {
    isRunning = false;

    const p = PHASES[currentPhase];
    const badge = document.getElementById('statusBadge');
    badge.className = 'status-badge complete';
    document.getElementById('statusText').textContent = 'Phase ' + p.id + ' Complete';

    // Show banner
    document.getElementById('phaseBanner').classList.add('show');

    // Enable next button
    document.getElementById('btnNext').disabled = false;
    document.getElementById('nextHint').textContent = 'Phase simulation complete. Proceed to the next phase.';

    // Start alert queue
    setTimeout(processAlertQueue, 500);
}

// ============================================================
// NAVIGATION
// ============================================================
function nextPhase() {
    if (isRunning) return;
    if (currentPhase >= PHASES.length - 1) {
        // All phases done
        showFinalReport();
        return;
    }
    currentPhase++;
    renderSidebar();
    renderPhase(currentPhase);
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goToPhase(idx) {
    if (isRunning) return;
    if (idx > currentPhase) return; // Can't skip ahead
    currentPhase = idx;
    renderSidebar();
    renderPhase(currentPhase);
}

// ============================================================
// RESET
// ============================================================
function resetLab() {
    clearInterval(typingInterval);
    isRunning = false;
    currentPhase = 0;
    terminalQueue = [];
    alertQueue = [];

    const badge = document.getElementById('statusBadge');
    badge.className = 'status-badge idle';
    document.getElementById('statusText').textContent = 'Ready';

    renderSidebar();
    renderPhase(0);
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.addEventListener('DOMContentLoaded', initLab);
